version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmmate_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - neo4j
      - redis
    networks:
      - farmmate_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmmate_frontend_prod
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - farmmate_net

  neo4j:
    image: neo4j:5
    container_name: farmmate_neo4j_prod
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/farmmatepassword
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - farmmate_net

  redis:
    image: redis:alpine
    container_name: farmmate_redis_prod
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - farmmate_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmmate_celery_prod
    env_file:
      - ./backend/.env
    command: ["celery", "-A", "app.infrastructure.celery.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      - redis
      - neo4j
    networks:
      - farmmate_net

networks:
  farmmate_net:
    driver: bridge

volumes:
  neo4j_data:
