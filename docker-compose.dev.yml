version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: farmmate_backend_dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app  # Hot-reload code
      - /app/.venv      # Tránh đè môi trường ảo trong container
    networks:
      - farmmate_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: farmmate_frontend_dev
    ports:
      - "5173:5173"     # Vite default port
    volumes:
      - ./frontend:/app # Hot-reload UI
      - /app/node_modules # Tránh đè node_modules trong container
    networks:
      - farmmate_net

networks:
  farmmate_net:
    driver: bridge
