<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FarmMate Login</title>

<style>
body{
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
}

.login-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#111827;
    color:white;
    cursor:pointer;
}

.error{
    color:red;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>FarmMate AI Login</h2>

    <input
        id="username"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Đăng nhập
    </button>

    <div id="error" class="error"></div>

</div>

<script>

async function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const formData =
        new URLSearchParams();

    formData.append("username", username);
    formData.append("password", password);

    try{

        const response =
            await fetch(
                "http://localhost:8000/api/v1/auth/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:formData
                }
            );

        if(!response.ok){
            throw new Error("Sai tài khoản hoặc mật khẩu");
        }

        const data =
            await response.json();

        localStorage.setItem(
            "access_token",
            data.access_token
        );

        window.location.href =
            "chat.html";
    }
    catch(err){

        document.getElementById("error")
            .innerText = err.message;
    }
}

</script>

</body>
</html>
