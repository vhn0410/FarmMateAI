<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmMate AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #111827;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 95vh;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 16px;

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        /* Header */

        .chat-header {
            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-bottom: 1px solid #e5e7eb;

            background: #ffffff;

            font-size: 16px;
            font-weight: 600;
            color: #111827;
        }

        .chat-header .subtitle {
            margin-left: 10px;
            color: #6b7280;
            font-weight: 400;
            font-size: 14px;
        }

        /* Chat Area */

        .chat-history {
            flex: 1;

            overflow-y: auto;

            padding: 32px;

            display: flex;
            flex-direction: column;
            gap: 18px;

            background: #fafafa;
        }

        /* Message Wrapper */

        .message-wrapper {
            display: flex;
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.bot {
            justify-content: flex-start;
        }

        /* Message Bubble */

        .message {
            max-width: 75%;

            padding: 14px 18px;

            border-radius: 16px;

            line-height: 1.7;
            font-size: 15px;

            word-wrap: break-word;
        }

        .msg-user {
            background: #111827;
            color: white;

            border-bottom-right-radius: 4px;
        }

        .msg-bot {
            background: white;

            border: 1px solid #e5e7eb;

            color: #111827;

            border-bottom-left-radius: 4px;

            white-space: pre-wrap;
        }

        /* Status */

        .status-box {
            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            background: #f3f4f6;

            color: #6b7280;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .status-box.done {
            display: none;
        }

        /* Input Area */

        .chat-input-area {
            padding: 20px;

            border-top: 1px solid #e5e7eb;

            background: #ffffff;

            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;

            height: 48px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            padding: 0 16px;

            font-size: 15px;

            outline: none;

            transition: all .2s ease;
        }

        #user-input:focus {
            border-color: #2563eb;
        }

        button {
            height: 48px;

            padding: 0 22px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: white;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            background: #1f2937;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Cursor */

        .blinking-cursor::after {
            content: "▋";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Scrollbar */

        .chat-history::-webkit-scrollbar {
            width: 8px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        .chat-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }
    </style>
</head>

<body>

    <div class="chat-container">


        <div class="chat-header">

            <div>
                FarmMate AI
                <span class="subtitle">
                    Agricultural Knowledge Assistant
                </span>
            </div>

            <button onclick="logout()" style="
                margin-left:auto;
                height:38px;
                padding:0 16px;
            ">
                Logout
            </button>

        </div>


        <div class="chat-history" id="chat-history">

            <div class="message-wrapper bot">
                <div class="message msg-bot">
Xin chào. Tôi là FarmMate AI Assistant.

Tôi có thể hỗ trợ bạn về:

• Kỹ thuật canh tác
• Quản lý đất đai
• Dinh dưỡng cây trồng
• Sâu bệnh hại
• Thông tin nông nghiệp

Hãy nhập câu hỏi của bạn.
                </div>
            </div>

        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">

            <button id="send-btn" onclick="sendMessage()">
                Gửi
            </button>
        </div>

    </div>

    <script>
        const token =
            localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "login.html";
        }

        const sessionId =
            "session-" +
            Math.random().toString(36).substring(2, 10);

        function logout() {

            localStorage.removeItem(
                "access_token"
            );

            window.location.href =
                "login.html";
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        function appendMessage(role, content) {

            const chatHistory =
                document.getElementById("chat-history");

            const wrapper =
                document.createElement("div");

            wrapper.className =
                `message-wrapper ${role}`;

            const div =
                document.createElement("div");

            div.className =
                `message ${role === "user"
                    ? "msg-user"
                    : "msg-bot"}`;

            div.innerHTML = content;

            wrapper.appendChild(div);

            chatHistory.appendChild(wrapper);

            chatHistory.scrollTop =
                chatHistory.scrollHeight;

            return div;
        }

        async function sendMessage() {

            const inputField =
                document.getElementById("user-input");

            const sendBtn =
                document.getElementById("send-btn");

            const query =
                inputField.value.trim();

            if (!query) return;

            inputField.value = "";

            inputField.disabled = true;
            sendBtn.disabled = true;

            appendMessage("user", query);

            const botMessageDiv =
                appendMessage("bot", "");

            const statusDiv =
                document.createElement("div");

            statusDiv.className =
                "status-box";

            statusDiv.innerText =
                "Processing request...";

            botMessageDiv.appendChild(statusDiv);

            const textDiv =
                document.createElement("span");

            textDiv.className =
                "blinking-cursor";

            botMessageDiv.appendChild(textDiv);

            try {

                const response =
                    await fetch(
                        "http://localhost:8000/api/v1/chat/stream",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization":
                                    `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                query: query,
                                session_id: sessionId
                            })
                        }
                    );

                if (response.status === 401) {

                    localStorage.removeItem(
                        "access_token"
                    );

                    alert(
                        "Phiên đăng nhập đã hết hạn"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder("utf-8");

                let partialLine = "";

                while (true) {

                    const {
                        done,
                        value
                    } = await reader.read();

                    if (done) break;

                    const chunk =
                        decoder.decode(
                            value,
                            { stream: true }
                        );

                    const lines =
                        (partialLine + chunk)
                            .split("\n\n");

                    partialLine =
                        lines.pop();

                    for (const line of lines) {

                        if (!line.startsWith("data: "))
                            continue;

                        try {

                            const data =
                                JSON.parse(
                                    line.replace(
                                        "data: ",
                                        ""
                                    )
                                );

                            if (data.event === "status") {

                                statusDiv.innerText =
                                    data.message;

                            }
                            else if (data.event === "token") {

                                statusDiv.classList
                                    .add("done");

                                textDiv.innerHTML +=
                                    data.text;

                                document
                                    .getElementById(
                                        "chat-history"
                                    )
                                    .scrollTop =
                                    document
                                        .getElementById(
                                            "chat-history"
                                        )
                                        .scrollHeight;
                            }
                            else if (data.event === "done") {

                                textDiv.classList
                                    .remove(
                                        "blinking-cursor"
                                    );

                                if (
                                    data.sources &&
                                    data.sources.length > 0
                                ) {

                                    let sourcesHtml =
                                        "<br><br><small style='color:#6b7280'><b>Sources</b><br>";

                                    data.sources.forEach(
                                        (s, i) => {

                                            sourcesHtml +=
                                                `${i + 1}. ${s.file_name}<br>`;

                                        });

                                    sourcesHtml +=
                                        "</small>";

                                    textDiv.innerHTML +=
                                        sourcesHtml;
                                }
                            }

                        } catch (err) {
                            console.log(
                                "Parse error:",
                                line
                            );
                        }
                    }
                }

            }
            catch (error) {

                statusDiv.classList
                    .add("done");

                textDiv.innerHTML =
                    `<span style="color:#dc2626">
                    Connection error:
                    ${error.message}
                </span>`;
            }
            finally {

                textDiv.classList
                    .remove(
                        "blinking-cursor"
                    );

                inputField.disabled = false;
                sendBtn.disabled = false;

                inputField.focus();
            }
        }



    </script>

</body>

</html>
