server {
    listen 80;

    # Phục vụ file tĩnh từ thư mục /usr/share/nginx/html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support cho Client-side Routing của React Router
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API đến backend (nếu sau này cần thiết)
    # Tuy nhiên hiện tại frontend dùng thẳng public URL của backend
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
